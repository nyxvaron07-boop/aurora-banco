let state = null;

async function loadState() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_state?id=eq.aurora&select=data`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    const data = await res.json();
    if (data && data.length > 0 && data[0].data) {

    } else {
      // Si no existe, crear el estado inicial
      await saveState(structuredClone(DEFAULT_STATE));
      return structuredClone(DEFAULT_STATE);
    }
  } catch (e) {
    console.warn('Error cargando desde Supabase, usando estado local:', e);
    // Intentar cargar desde localStorage como respaldo
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e2) {}
    return structuredClone(DEFAULT_STATE);
  }
}

async function saveState(newState) {
  if (isSaving) return;
  isSaving = true;
  try {
    const stateToSave = newState || state;
    // Guardar en Supabase (UPSERT)
    await fetch(`${SUPABASE_URL}/rest/v1/app_state`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({
        id: 'aurora',
        data: stateToSave,
        updated_at: new Date().toISOString()
      })
    });
    // Guardar también en localStorage como respaldo
    localStorage.setItem(STORE_KEY, JSON.stringify(stateToSave));
  } catch (e) {
    console.warn('Error guardando en Supabase, guardando localmente:', e);
    localStorage.setItem(STORE_KEY, JSON.stringify(newState || state));
  } finally {
    isSaving = false;
  }
}

// Función para cargar el estado inicial
async function initState() {
  state = await loadState();
  // Migración de seguridad
  if (!Array.isArray(state.depositRequests)) state.depositRequests = [];
  state.students?.forEach(s => {
    if (s.photo===undefined) s.photo='';
  });
  state.users?.forEach(u => {
    if (u.photo===undefined) u.photo='';
    if (u.bio===undefined) u.bio='';
  });
  // Iniciar sincronización en tiempo real
  startRealtimeSync();
  // Sincronizar cada 5 segundos como respaldo
  syncInterval = setInterval(async () => {
    if (!isSaving) {
      try {
        const freshState = await loadState();
        if (freshState) {
          // Solo actualizar si hay cambios significativos
          const currentJson = JSON.stringify(state);
          const freshJson = JSON.stringify(freshState);
          if (currentJson !== freshJson) {
            state = freshState;
            render();
            toast('🔄 Datos sincronizados desde la nube', 'info');
          }
        }
      } catch(e) {}
    }
  }, 5000);
}

// Iniciar suscripción a cambios en tiempo real (WebSocket)
function startRealtimeSync() {
  try {
    // Usar el canal de tiempo real de Supabase
    const ws = new WebSocket(`wss://${SUPABASE_URL.replace('https://', '').replace('http://', '')}/realtime/v1/websocket?apikey=${SUPABASE_KEY}`);
    ws.onopen = () => {
      ws.send(JSON.stringify({
        event: 'phx_join',
        payload: {},
        ref: '1',
        topic: 'realtime:app_state'
      }));
    };
    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.event === 'postgres_changes' && data.payload?.new?.id === 'aurora') {
          // Recargar datos cuando hay cambio en la BD
          loadState().then(freshState => {
            if (freshState) {
              const currentJson = JSON.stringify(state);
              const freshJson = JSON.stringify(freshState);
              if (currentJson !== freshJson) {
                state = freshState;
                render();
                toast('✨ Datos actualizados en tiempo real', 'gold');
              }
            }
          });
        }
      } catch(e) {}
    };
  } catch(e) {
    console.log('Tiempo real no disponible, usando polling');
  }
}

// ---------- ROUTER / RENDER ----------
let route = 'dashboard';
let selectedStudentId = null;

function render() {
  const app = $('#app');
  if (!state.session) { app.innerHTML = viewLogin(); wireLogin(); return; }
  const user = state.users.find(u => u.id === state.session.userId);
  if (!user) { state.session = null; saveState(state); render(); return; }

  if (user.role === 'estudiante') {
    app.innerHTML = viewStudentPortal(user);
    wireStudentPortal();
    return;
  }

  app.innerHTML = shell(user);
  wireShell();
  const main = $('#main');
  switch(route) {
    case 'dashboard': main.innerHTML = viewDashboard(); wireDashboard(); break;
    case 'students': main.innerHTML = viewStudents(); wireStudents(); break;
    case 'student': main.innerHTML = viewStudentDetail(); wireStudentDetail(); break;
    case 'deposits': main.innerHTML = viewOperation('deposit'); wireOperation('deposit'); break;
    case 'withdrawals': main.innerHTML = viewOperation('withdraw'); wireOperation('withdraw'); break;
    case 'transfers': main.innerHTML = viewTransfer(); wireTransfer(); break;
    case 'purchases': main.innerHTML = viewOperation('purchase'); wireOperation('purchase'); break;
    case 'history': main.innerHTML = viewHistory(); wireHistory(); break;
    case 'requests': main.innerHTML = viewRequests(); wireRequests(); break;
    case 'notifications': main.innerHTML = viewNotifications(); break;
    case 'admin': main.innerHTML = viewAdmin(); wireAdmin(); break;
    case 'profile': main.innerHTML = viewProfile(); wireProfile(); break;
    default: main.innerHTML = viewDashboard(); wireDashboard();
  }
}

    const p = fd.get('password').toString();

    if (!user) { toast('Credenciales inválidas. La bóveda permanece sellada.', 'err'); return; }
    state.session = { userId: user.id, role: user.role };
    saveState(state);
    toast(`Bienvenido, ${user.name} ✦`, 'gold');
    route = user.role === 'estudiante' ? 'portal' : 'dashboard';
    render();
  });

function wireShell() {
  $$('[data-route]').forEach(b => b.addEventListener('click', () => {
    route = b.dataset.route;
    if (route !== 'student') selectedStudentId = null;
    $('#drawer')?.classList.add('hidden');
    render();
  }));
  $('#openMenu')?.addEventListener('click', ()=> $('#drawer').classList.remove('hidden'));
  $('#drawerBg')?.addEventListener('click', ()=> $('#drawer').classList.add('hidden'));
  $('#logoutBtn')?.addEventListener('click', doLogout);
  $('#logoutBtn2')?.addEventListener('click', doLogout);
  [$('#globalSearch'), $('#globalSearchM')].forEach(inp => inp && inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = e.target.value.trim();
      if (!q) return;
      route = 'history';
      render();
      setTimeout(()=>{ const s = $('#historySearch'); if (s){ s.value = q; s.dispatchEvent(new Event('input')); } }, 50);

  }));
}
function doLogout(){ state.session = null; saveState(state); route='dashboard'; render(); toast('Sesión sellada. Hasta pronto.','info'); }

// ---------- DASHBOARD ----------
function computeStats() {
  const totalBalance = state.students.reduce((a,s)=>a+s.balance, 0);
  const today = new Date(); today.setHours(0,0,0,0);
  const todayMs = today.getTime();
  const todays = state.movements.filter(m => m.ts >= todayMs);
  const depositsToday = todays.filter(m=>m.kind==='deposit').reduce((a,m)=>a+m.amount,0);
  const transfersToday = todays.filter(m=>m.kind==='transfer_out').length;
  const purchasesToday = todays.filter(m=>m.kind==='purchase').reduce((a,m)=>a+m.amount,0);
  return { totalBalance, students: state.students.length, accounts: state.students.length, depositsToday, transfersToday, purchasesToday };
}
function viewDashboard() {
  const s = computeStats();
  const recent = [...state.movements].sort((a,b)=>b.ts-a.ts).slice(0,8);
  const byHouse = HOUSES.map(h => ({ h, total: state.students.filter(x=>x.house===h).reduce((a,x)=>a+x.balance,0) }));
  const maxH = Math.max(1, ...byHouse.map(x=>x.total));
  const last7 = Array.from({length:7}).map((_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-(6-i)); d.setHours(0,0,0,0);
    const next = d.getTime()+86400000;
    const v = state.movements.filter(m=>m.ts>=d.getTime()&&m.ts<next).reduce((a,m)=>a+m.amount,0);
    return { d, v };
  });
  const maxV = Math.max(1, ...last7.map(x=>x.v));

  return `
  <div class="space-y-6">
    <div class="flex items-end justify-between gap-4 flex-wrap">
      <div>
        <div class="text-[11px] tracking-[0.3em] text-gold uppercase">Bóveda Central</div>
        <h1 class="font-display text-2xl md:text-3xl mt-1 shimmer-text">AURORA — Banco Mágico</h1>
        <p class="text-violet-200/70 font-serifm italic mt-1">"Donde el oro susurra en runas antiguas."</p>
      </div>
      <div class="flex gap-2">
        <button data-route="deposits" class="btn-gold px-4 py-2.5 rounded-xl text-sm flex items-center gap-2">${icon('plus','w-4 h-4')} Depósito</button>
        <button data-route="transfers" class="btn-magic px-4 py-2.5 rounded-xl text-sm flex items-center gap-2">${icon('wand','w-4 h-4')} Transferir</button>
      </div>
    </div>

    <!-- KPI cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      ${kpi('Saldo total', fmt(s.totalBalance)+' G', 'vault', 'from-gold to-violet2')}
      ${kpi('Estudiantes', s.students, 'users')}
      ${kpi('Cuentas activas', s.accounts, 'key')}
      ${kpi('Depósitos hoy', fmt(s.depositsToday)+' G', 'coin')}
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <!-- Chart -->
      <div class="glass rune-border rounded-2xl p-5 lg:col-span-2 card-hover">
        <div class="flex items-center justify-between mb-4">
          <div>
            <div class="text-xs uppercase tracking-[0.24em] text-gold">Flujo arcano · últimos 7 días</div>
            <div class="font-display text-lg mt-1">Energía financiera</div>
          </div>
          <div class="badge badge-violet">Live</div>
        </div>
        <div class="flex items-end gap-3 h-44 md:h-56">
          ${last7.map(x => {
            const h = Math.max(6, (x.v/maxV)*100);
            const label = x.d.toLocaleDateString('es-CO',{weekday:'short'}).replace('.','');
            return `<div class="flex-1 flex flex-col items-center gap-2">
              <div class="w-full bar" style="height:${h}%"></div>
              <div class="text-[10px] uppercase tracking-widest text-violet-300/70">${label}</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <!-- Houses -->
      <div class="glass rune-border rounded-2xl p-5 card-hover">
        <div class="text-xs uppercase tracking-[0.24em] text-gold">Riqueza por casa</div>
        <div class="font-display text-lg mt-1 mb-4">Ranking mágico</div>
        <div class="space-y-3">
          ${byHouse.sort((a,b)=>b.total-a.total).map(x => `
            <div>
              <div class="flex items-center justify-between text-sm mb-1">
                <span class="flex items-center gap-2"><span class="text-lg">${HOUSE_ICON[x.h]}</span>${x.h}</span>
                <span class="text-gold font-semibold">${fmt(x.total)} G</span>
              </div>
              <div class="h-2 rounded-full bg-white/5 overflow-hidden">
                <div class="h-full ${HOUSE_CLASS[x.h]}" style="width:${(x.total/maxH)*100}%; box-shadow:0 0 12px rgba(201,162,76,.4);"></div>
              </div>
            </div>`).join('')}
        </div>
      </div>
    </div>

    <!-- Recent -->
    <div class="glass rune-border rounded-2xl p-5">
      <div class="flex items-center justify-between mb-4">
        <div class="font-display text-lg">Actividad reciente</div>
        <button data-route="history" class="text-xs text-gold hover:underline">Ver todo →</button>
      </div>
      ${recent.length ? `<div class="space-y-2">${recent.map(mvRow).join('')}</div>` : `<div class="text-center py-8 text-violet-300/60 font-serifm italic">La bóveda aún guarda silencio. Registra el primer movimiento.</div>`}
    </div>
  </div>`;
}
function kpi(label, value, ic) {
  return `<div class="glass rune-border rounded-2xl p-4 md:p-5 card-hover relative overflow-hidden">
    <div class="absolute -right-4 -bottom-4 w-24 h-24 rounded-full opacity-20" style="background: radial-gradient(circle, #C9A24C, transparent 60%);"></div>
    <div class="flex items-center justify-between">
      <div class="text-[10px] uppercase tracking-[0.22em] text-violet-200/70">${label}</div>
      <span class="w-8 h-8 grid place-items-center rounded-lg glass text-gold">${I[ic]}</span>
    </div>
    <div class="mt-3 font-display text-xl md:text-2xl shimmer-text">${value}</div>
  </div>`;
}
function mvRow(m) {
  const s = state.students.find(x=>x.id===m.studentId);
  const sign = ['deposit','transfer_in'].includes(m.kind) ? '+' : '-';
  const color = sign === '+' ? 'text-emerald-300' : 'text-rose-300';
  const kindLabel = { deposit:'Depósito', withdraw:'Retiro', purchase:'Compra', transfer_out:'Transferencia enviada', transfer_in:'Transferencia recibida' }[m.kind] || m.kind;
  return `<div class="flex items-center gap-3 p-3 rounded-xl bg-white/[.03] hover:bg-white/[.06] transition">
    <div class="w-10 h-10 rounded-full ${s? HOUSE_CLASS[s.house]:''} grid place-items-center text-lg shrink-0">${s?.avatar||'✦'}</div>
    <div class="min-w-0 flex-1">
      <div class="text-sm font-medium truncate">${s?.name||'—'} <span class="text-violet-300/60 text-xs">· ${kindLabel}</span></div>

    </div>
    <div class="text-right shrink-0">
      <div class="${color} font-semibold text-sm">${sign}${fmt(m.amount)} G</div>
    </div>
  </div>`;
}
function wireDashboard() {
  $$('[data-route]').forEach(b => b.addEventListener('click', () => { route = b.dataset.route; render(); }));
}

function wireStudents() {

  $('#newStudentBtn').addEventListener('click', ()=> openStudentModal(null));

function openStudentModal(id) {
  const s = id ? state.students.find(x=>x.id===id) : null;
  showModal(`
    <form id="studentForm" class="space-y-4">
      <div class="text-[11px] tracking-[0.28em] text-gold uppercase">${s?'Editar':'Nuevo'} estudiante</div>
      <h3 class="font-display text-xl shimmer-text">${s?s.name:'Registrar hechicero'}</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div><label class="label">Nombre</label><input class="input mt-1" name="name" value="${s?.name||''}" required></div>
        <div><label class="label">Casa</label><select class="input mt-1" name="house">${HOUSES.map(h=>`<option ${s?.house===h?'selected':''}>${h}</option>`).join('')}</select></div>
        <div><label class="label">Estado</label><select class="input mt-1" name="status"><option ${s?.status==='Activo'?'selected':''}>Activo</option><option ${s?.status==='Inactivo'?'selected':''}>Inactivo</option></select></div>
        <div><label class="label">Saldo inicial (G)</label><input class="input mt-1" name="balance" type="number" min="0" value="${s?.balance||''}" placeholder=""></div>
        <div>
          <label class="label">Foto (opcional)</label>
          <input class="input mt-1" name="photoFile" type="file" accept="image/*" capture="environment">
        </div>
        <div class="md:col-span-2"><label class="label">Descripción / Observaciones</label><textarea class="input mt-1" name="notes" rows="2" placeholder="Cuenta algo sobre ti…">${s?.notes||''}</textarea></div>
      </div>
      <div class="flex items-center justify-between gap-2 pt-2">
        <div>${s?`<button type="button" id="delBtn" class="text-rose-300 text-sm hover:text-rose-200">Eliminar</button>`:''}</div>
        <div class="flex gap-2">
          <button type="button" class="btn-ghost px-4 py-2 rounded-xl text-sm" onclick="closeModal()">Cancelar</button>
          <button class="btn-gold px-4 py-2 rounded-xl text-sm">${s?'Guardar':'Crear cuenta mágica'}</button>
        </div>
      </div>
    </form>
  `);
  $('#studentForm').addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.target;
    const fileInput = form.querySelector('[name=photoFile]');
    const file = fileInput?.files?.[0];
    let photoData = s?.photo || '';
    if (file) {
      photoData = await new Promise((res)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file); });
    }
    const fd = Object.fromEntries(new FormData(form).entries());
    delete fd.photoFile;
    fd.balance = Math.max(0, parseFloat(fd.balance)||0);
    if (!fd.avatar) fd.avatar = '✦';
    fd.photo = photoData;
    if (s) { Object.assign(s, fd); toast('Estudiante actualizado.','ok'); saveState(state); closeModal(); render(); }
    else {
      const nid = nextStudentId();
      const newStudent = { id:nid, ...fd, enrolled:Date.now(), history:[] };
      state.students.push(newStudent);
      // Auto-crear cuenta de usuario para el estudiante
      const username = generateUsername(fd.name);
      const password = generatePassword();
      const newUser = { id:uid('u'), name:fd.name, username, password, role:'estudiante', studentId:nid, createdAt:Date.now() };
      state.users.push(newUser);
      notify('Nueva cuenta creada', `${fd.name} · ${nid}`, 'gold');
      saveState(state);
      closeModal();
      showCredentialsModal(newStudent, newUser);
    }
  });
  $('#delBtn')?.addEventListener('click', ()=>{
    if (!confirm('¿Eliminar estudiante y su cuenta? Esta acción no se puede deshacer.')) return;
    state.students = state.students.filter(x=>x.id!==s.id);
    state.movements = state.movements.filter(m=>m.studentId!==s.id);
    state.users = state.users.filter(u=>u.studentId!==s.id);
    saveState(state); closeModal(); toast('Estudiante eliminado.','err'); render();
  });
}

function generateUsername(name){
  const base = (name||'mago').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'').slice(0,10) || 'mago';
  const suffix = Math.floor(100+Math.random()*900);
  return `${base}${suffix}`;
}
function generatePassword(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let p = ''; for (let i=0;i<6;i++) p += chars[Math.floor(Math.random()*chars.length)];
  return p;
}
function copyText(t){
  if (navigator.clipboard) return navigator.clipboard.writeText(t);
  const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  return Promise.resolve();
}

function viewStudentDetail() {

        </div>
        <div class="text-right">
          <div class="text-[11px] uppercase tracking-widest text-violet-200/70">Saldo actual</div>
          <div class="font-display text-3xl md:text-4xl shimmer-text mt-1">${fmt(s.balance)} G</div>
          <div class="mt-3 flex gap-2 justify-end">

            const h = Math.max(4, Math.abs(v)/maxV*100);
            const color = v>=0 ? 'linear-gradient(180deg,#F1D08A,#C9A24C)' : 'linear-gradient(180deg,#f472b6,#9333ea)';
            return `<div class="flex-1 rounded-md" style="height:${h}%; background:${color}; box-shadow:0 0 10px rgba(167,139,250,.4);"></div>`;

          ${statRow('Compras totales', movs.filter(m=>m.kind==='purchase').reduce((a,m)=>a+m.amount,0))}
          ${statRow('Transferencias enviadas', movs.filter(m=>m.kind==='transfer_out').reduce((a,m)=>a+m.amount,0))}

function currentUser(){ return state.users.find(u=>u.id===state.session.userId); }
function wireOperation(kind) {
  $('#opForm').addEventListener('submit', e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target).entries());
    const amount = Math.max(0, parseFloat(fd.amount)||0);
    if (!fd.studentId || !amount) return toast('Datos inválidos.','err');
    const s = state.students.find(x=>x.id===fd.studentId);
    if (kind !== 'deposit' && s.balance < amount) return toast('Saldo insuficiente. La bóveda rechaza el conjuro.','err');
    if (kind === 'deposit') s.balance += amount; else s.balance -= amount;
    state.movements.push({ id:uid('m'), studentId:s.id, kind, amount, description:fd.description||'', category:fd.category||'', responsible:fd.responsible||'', ts:Date.now() });
    notify(opMeta(kind).title+' registrado', `${s.name} · ${fmt(amount)} G`, kind==='deposit'?'gold':'info');
    saveState(state); toast(`${opMeta(kind).title} de ${fmt(amount)} G registrado.`, kind==='deposit'?'gold':'ok'); render();
  });
}

function wireTransfer() {
  $('#trForm').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target).entries());
    const amount = Math.max(0, parseFloat(fd.amount)||0);
    if (fd.from === fd.to) return toast('Origen y destino no pueden ser iguales.','err');
    const from = state.students.find(x=>x.id===fd.from);
    const to = state.students.find(x=>x.id===fd.to);
    if (!from || !to || !amount) return toast('Datos inválidos.','err');
    if (from.balance < amount) return toast('Saldo insuficiente en la cuenta origen.','err');
    from.balance -= amount; to.balance += amount;
    const ts = Date.now();
    state.movements.push({ id:uid('m'), studentId:from.id, kind:'transfer_out', amount, description:`→ ${to.name}: ${fd.description||''}`, responsible:fd.responsible, ts });
    state.movements.push({ id:uid('m'), studentId:to.id, kind:'transfer_in', amount, description:`← ${from.name}: ${fd.description||''}`, responsible:fd.responsible, ts });
    notify('Transferencia mágica', `${from.name} → ${to.name} · ${fmt(amount)} G`, 'info');
    saveState(state); toast('Transferencia realizada con éxito.','ok'); render();
  });
}

}

          <div class="font-display text-lg shimmer-text">+${fmt(r.amount)} G</div>
          <div class="mt-1">${reqStatusBadge(r.status)}</div>
        </div>
        ${actions?`<div class="flex gap-2 md:ml-3">
          <button data-approve="${r.id}" class="btn-gold px-3 py-2 rounded-lg text-xs">Verificar</button>
          <button data-reject="${r.id}" class="btn-ghost px-3 py-2 rounded-lg text-xs text-rose-200">Rechazar</button>

    </div>

    <div class="glass rune-border rounded-2xl p-5">
      <div class="font-display text-lg mb-3">Historial de solicitudes</div>
      ${reviewed.length ? `<div class="space-y-2">${reviewed.map(r=>reqRow(r,false)).join('')}</div>`

function wireRequests() {
  $$('[data-approve]').forEach(b=>b.addEventListener('click',()=>{

    const s = state.students.find(x=>x.id===r.studentId); if (!s) return toast('Estudiante no existe.','err');
    s.balance += r.amount;
    state.movements.push({ id:uid('m'), studentId:s.id, kind:'deposit', amount:r.amount, description:(r.description||'Depósito solicitado')+' · verificado', responsible:currentUser().name, ts:Date.now() });
    r.status='approved'; r.reviewedBy=currentUser().name; r.reviewedAt=Date.now();
    notify('Depósito verificado', `${s.name} +${fmt(r.amount)} G`, 'gold');
    saveState(state); toast('Depósito verificado y acreditado.','gold'); render();
  }));
  $$('[data-reject]').forEach(b=>b.addEventListener('click',()=>{
    const r = state.depositRequests.find(x=>x.id===b.dataset.reject); if (!r || r.status!=='pending') return;
    const note = prompt('Motivo del rechazo (opcional):','')||'';
    r.status='rejected'; r.reviewedBy=currentUser().name; r.reviewedAt=Date.now(); r.reviewNote=note;
    const s = state.students.find(x=>x.id===r.studentId);

    saveState(state); toast('Solicitud rechazada.','err'); render();
  }));
}

  }));
  $$('[data-role]').forEach(sel=>sel.addEventListener('change', ()=>{
    const u = state.users.find(x=>x.id===sel.dataset.role); if (!u) return;
    u.role = sel.value; saveState(state); toast(`Rol de ${u.name} → ${u.role}`,'gold'); render();
  }));
  $$('[data-showcred]').forEach(b=>b.addEventListener('click', ()=>{
    const u = state.users.find(x=>x.id===b.dataset.showcred); if (!u) return;

    showCredentialsModal(linked, u);
  }));
  $('#exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], { type:'application/json' });
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='aurora-backup.json'; a.click();
    toast('Respaldo generado.','gold');
  });
  $('#importFile').addEventListener('change', e=>{
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ()=> { try { state = JSON.parse(r.result); saveState(state); toast('Datos importados.','ok'); render(); } catch(err){ toast('Archivo inválido.','err'); } };
    r.readAsText(f);
  });
  $('#seedBtn').addEventListener('click', ()=>{
    const now = Date.now();
    state.students.forEach((s,i)=>{
      for (let k=0;k<3;k++){
        const amount = 50+Math.floor(Math.random()*300);
        s.balance += amount;
        state.movements.push({ id:uid('m'), studentId:s.id, kind:'deposit', amount, description:'Depósito ceremonial', responsible:'Grimwold', ts: now - Math.floor(Math.random()*6*86400000) });
      }
    });
    saveState(state); toast('Datos demo sembrados.','ok'); render();
  });
  $('#resetBtn').addEventListener('click', ()=>{
    if (!confirm('¿Restablecer toda la bóveda al estado demo? Se perderán los datos actuales.')) return;

    const currentSession = state.session;
    state = structuredClone(DEFAULT_STATE);
    state.session = currentSession || { userId:'u-admin', role:'admin' };
    saveState(state); toast('Bóveda restablecida al estado demo.','err'); render();
  });
  $('#nukeBtn').addEventListener('click', ()=>{
    const code = prompt('⚠ Esto BORRARÁ todo el banco (estudiantes, movimientos, solicitudes, notificaciones y cuentas). Solo el Archimago sobrevivirá.\n\nEscribe REINICIAR para confirmar:');
    if (code !== 'REINICIAR') { toast('Reinicio cancelado.','info'); return; }
    const admin = state.users.find(u=>u.id==='u-admin') || DEFAULT_STATE.users[0];
    state = {
      users: [admin],
      students: [],
      movements: [],
      depositRequests: [],
      notifications: [{ id:uid('n'), type:'info', title:'Sistema reiniciado', msg:'La bóveda ha sido purificada por el Archimago.', ts:Date.now(), read:false }],
      session: { userId: admin.id, role: admin.role },
    };
    saveState(state); toast('🔥 Sistema reiniciado por completo.','err'); route='dashboard'; render();
  });
}

      <div class="glass rune-border rounded-2xl p-5">
        <div class="font-display text-lg mb-3">Notificaciones del banco</div>
        ${notifs.length ? notifs.map(n=>`<div class="p-3 rounded-xl bg-white/[.03] mb-2"><div class="text-sm font-semibold">${n.title}</div><div class="text-xs text-violet-200/80">${n.msg}</div><div class="text-[10px] text-violet-300/50 uppercase tracking-widest mt-1">${fmtDate(n.ts)}</div></div>`).join('') : `<div class="text-center py-6 text-violet-300/60 font-serifm italic">Sin avisos por ahora.</div>`}
      </div>
      ${FOOTER()}
    </main>
    ${modalHost()}
  </div>`;
}
function wireStudentPortal() {
  $('#logoutBtn').addEventListener('click', doLogout);
  $('#editMyProfile')?.addEventListener('click', openProfileEditor);
  const form = $('#reqForm');
  if (form) form.addEventListener('submit', e=>{
    e.preventDefault();
    const user = currentUser();
    const s = state.students.find(x=>x.id===user.studentId);
    if (!s) return toast('Tu cuenta no está vinculada a un estudiante.','err');
    const fd = Object.fromEntries(new FormData(e.target).entries());
    const amount = Math.max(0, parseFloat(fd.amount)||0);
    if (!amount) return toast('Monto inválido.','err');
    state.depositRequests.push({ id:uid('r'), studentId:s.id, amount, description:fd.description||'', ts:Date.now(), status:'pending' });
    notify('Nueva solicitud de depósito', `${s.name} solicita +${fmt(amount)} G`, 'info');
    saveState(state); toast('Solicitud enviada. Espera verificación.','gold');
    e.target.reset(); render();
  });
}

// ---------- PROFILE (admin / duende / estudiante) ----------
function viewProfile() {
  const u = currentUser();
  const linked = u.studentId ? state.students.find(x=>x.id===u.studentId) : null;
  // Perfil temático: admin usa dorado; usuarios con estudiante usan colores de casa
  const house = linked?.house || 'Solaris';
  const houseCls = u.role === 'admin'
    ? 'bg-gradient-to-br from-amber-500 via-yellow-600 to-amber-800'
    : HOUSE_CLASS[house];
  const icon = u.role==='admin' ? '👑' : (linked?.avatar || (u.role==='duende'?'ᚱ':'★'));
  const photo = u.photo || linked?.photo || '';
  const bio = u.bio ?? (linked?.notes || '');
  const balance = linked ? linked.balance : null;

  return `
  <div class="space-y-6 max-w-3xl mx-auto">
    <div>
      <div class="text-[11px] tracking-[0.3em] text-gold uppercase">Ficha Arcana</div>
      <h1 class="font-display text-2xl md:text-3xl mt-1 shimmer-text">Mi Perfil</h1>
    </div>

    <div class="glass-strong rune-border rounded-3xl overflow-hidden relative">
      <div class="${houseCls} h-32 relative">
        <div class="absolute inset-0 opacity-30" style="background: radial-gradient(circle at 20% 30%, rgba(255,255,255,.4), transparent 40%), radial-gradient(circle at 80% 70%, rgba(201,162,76,.5), transparent 50%);"></div>
        <div class="absolute top-3 right-4 text-[10px] tracking-[0.3em] uppercase text-white/70">${u.role==='admin'?'Archimago':u.role==='duende'?'Duende Bancario':'Hechicero'}</div>
      </div>
      <div class="px-6 pb-6 -mt-14 relative">
        <div class="flex items-end gap-4">
          <div class="w-28 h-28 rounded-3xl ${houseCls} grid place-items-center text-5xl shadow-glow border-4 border-black/40 overflow-hidden">
            ${photo?`<img src="${photo}" class="w-full h-full object-cover"/>`:icon}
          </div>
          <div class="flex-1 min-w-0 pb-2">
            <h2 class="font-display text-2xl md:text-3xl">${u.name}</h2>
            <div class="text-[11px] text-gold uppercase tracking-widest">@${u.username}</div>
          </div>
        </div>

        <div class="mt-4 flex flex-wrap gap-2">
          ${linked?`<span class="badge badge-violet">${HOUSE_ICON[house]} ${house}</span>`:''}
          ${linked?`<span class="badge badge-gold">${linked.id}</span>`:''}
          <span class="badge ${u.role==='admin'?'badge-gold':u.role==='duende'?'badge-violet':'badge-emerald'}">${u.role}</span>
          ${balance!==null?`<span class="badge badge-gold">💰 ${fmt(balance)} G</span>`:''}
        </div>

        <div class="mt-4 glass rounded-2xl p-4">
          <div class="label mb-2">Sobre mí</div>
          <p class="text-sm text-violet-100/90 font-serifm italic">${bio ? bio : '<span class="text-violet-300/50 not-italic">Sin descripción aún. Edita tu perfil y cuenta algo sobre ti…</span>'}</p>
        </div>

        <div class="mt-4 flex justify-end">
          <button id="editProfileBtn" class="btn-gold px-5 py-2.5 rounded-xl text-sm">✎ Editar mi perfil</button>
        </div>
      </div>
    </div>

    ${u.role==='admin'?`
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        ${kpi('Estudiantes', state.students.length, 'users')}
        ${kpi('Cuentas', state.users.length, 'key')}
        ${kpi('Movimientos', state.movements.length, 'book')}
        ${kpi('Saldo Total', fmt(state.students.reduce((a,s)=>a+s.balance,0))+' G', 'vault')}
      </div>`:''}
  </div>
  ${modalHost()}`;
}
function wireProfile() {
  $('#editProfileBtn').addEventListener('click', openProfileEditor);
}
function openProfileEditor() {
  const u = currentUser();
  const linked = u.studentId ? state.students.find(x=>x.id===u.studentId) : null;
  const currentPhoto = u.photo || linked?.photo || '';
  const currentBio = u.bio ?? linked?.notes ?? '';
  const isStudent = u.role === 'estudiante';
  showModal(`
    <form id="profileForm" class="space-y-5">
      <div>
        <div class="text-[11px] tracking-[0.28em] text-gold uppercase">Editar perfil</div>
        <h3 class="font-display text-xl shimmer-text mt-1">${u.name}</h3>
      </div>

      <div class="flex flex-col sm:flex-row items-center gap-4 glass rounded-2xl p-4">
        <div id="photoPreview" class="w-24 h-24 rounded-2xl bg-violet-900/40 grid place-items-center overflow-hidden text-3xl shrink-0 border border-violet-500/25">
          ${currentPhoto?`<img src="${currentPhoto}" class="w-full h-full object-cover"/>`:'📷'}
        </div>
        <div class="flex-1 w-full">
          <label class="label">Foto de perfil</label>
          <input class="input mt-1" type="file" name="photoFile" accept="image/*">
          <p class="text-[11px] text-violet-300/60 mt-1">Elige una imagen desde tu dispositivo.</p>
        </div>
      </div>

      <div>
        <label class="label">Nombre visible</label>
        <input class="input mt-1" name="name" value="${u.name}" required>
      </div>

      <div>
        <label class="label">Descripción / Sobre mí</label>
        <textarea class="input mt-1" name="bio" rows="4" placeholder="Cuenta algo mágico sobre ti…">${currentBio}</textarea>
      </div>

      ${isStudent?`
      <div class="glass rounded-2xl p-4 space-y-3">
        <div class="label">Cambiar contraseña (4 dígitos)</div>
        <p class="text-[11px] text-violet-300/60">Deja vacío si no deseas cambiarla. Debe ser exactamente 4 números.</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div><label class="label">Nueva clave</label><input class="input mt-1 tracking-[0.5em] text-center" name="pin1" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="••••"></div>
          <div><label class="label">Confirmar clave</label><input class="input mt-1 tracking-[0.5em] text-center" name="pin2" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="••••"></div>
        </div>
      </div>`:''}

      <div class="flex justify-end gap-2 pt-1">
        <button type="button" class="btn-ghost px-4 py-2 rounded-xl text-sm" onclick="closeModal()">Cancelar</button>
        <button class="btn-gold px-4 py-2 rounded-xl text-sm">Guardar cambios</button>
      </div>
    </form>
  `);
  const fileInput = $('#profileForm [name=photoFile]');
  fileInput.addEventListener('change', ()=>{
    const f = fileInput.files?.[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ()=>{ $('#photoPreview').innerHTML = `<img src="${r.result}" class="w-full h-full object-cover"/>`; };
    r.readAsDataURL(f);
  });
  $('#profileForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = fd.get('name')?.toString().trim() || u.name;
    const bio = fd.get('bio')?.toString() || '';
    const file = fd.get('photoFile');
    let photo = currentPhoto;
    if (file && file.size) {
      photo = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file); });
    }
    if (isStudent) {
      const pin1 = (fd.get('pin1')||'').toString().trim();
      const pin2 = (fd.get('pin2')||'').toString().trim();
      if (pin1 || pin2) {
        if (!/^[0-9]{4}$/.test(pin1)) return toast('La clave debe tener exactamente 4 dígitos.','err');
        if (pin1 !== pin2) return toast('Las claves no coinciden.','err');
        u.password = pin1;
      }
    }
    u.name = name;
    u.bio = bio;
    u.photo = photo;
    if (linked) { linked.name = name; linked.notes = bio; linked.photo = photo; }
    saveState(state); closeModal(); toast('Perfil actualizado ✦','gold'); render();
  });
}


// ---------- MODAL ----------
function modalHost() { return `<div id="modalHost"></div>`; }
function showModal(html) {
  const host = $('#modalHost');
  if (!host) return;
  host.innerHTML = `
    <div class="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4 fade-in">
      <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeModal()"></div>
      <div class="relative w-full md:max-w-2xl glass-strong rune-border rounded-t-3xl md:rounded-3xl p-6 max-h-[92vh] overflow-y-auto safe-bottom">
        ${html}
      </div>
    </div>`;
}
function closeModal() { const h=$('#modalHost'); if (h) h.innerHTML=''; }
window.closeModal = closeModal;

// ---------- BOOT ----------
// Inicializar el estado desde Supabase antes de renderizar
initState().then(() => {
  // Verificar si la sesión sigue siendo válida
  if (state.session) {
    const user = state.users.find(u => u.id === state.session.userId);
    if (!user) {
      state.session = null;
      saveState(state);
    }
  }
  render();
}).catch(err => {
  console.error('Error inicializando:', err);
  // Fallback: usar estado local
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) state = JSON.parse(raw);
    else state = structuredClone(DEFAULT_STATE);
  } catch(e) {
    state = structuredClone(DEFAULT_STATE);
  }
  render();
});
</script>
